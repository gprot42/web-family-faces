<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Faces (AI)</title>
    <link rel="icon" type="image/jpeg" href="/family-faces-logo.jpg" />
    <link rel="apple-touch-icon" href="/family-faces-logo.jpg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("photosort-theme");
          if (t === "light" || t === "tokyo-night" || t === "present") {
            document.documentElement.setAttribute("data-theme", t);
            document.documentElement.style.colorScheme = t === "tokyo-night" ? "dark" : "light";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,680&family=Figtree:wght@400;500;600;650&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
